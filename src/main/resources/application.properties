spring.application.name=culturavibe-act3
# Puerto asignado a Perla (GVPD) para la Act3 en el VPS del equipo.
# La Act1 sigue en el 8081 y la Act2 en el 8083, para no chocar.
server.port=8084

# Propiedades personalizadas que se leen con @Value y se muestran en las vistas.
culturavibe.nombre=CulturaVibe
culturavibe.autora=Perla Danae Gallardo Vasquez (GVPD)

# Base de datos MySQL. Las credenciales se pasan con variables de entorno
# para no subirlas al repositorio (DB_URL, DB_USER, DB_PASSWORD).
# En local, con MySQL corriendo, basta con que exista el usuario root sin
# contraseña; la base se crea sola con createDatabaseIfNotExist=true.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/culturavibe_act3?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Mexico_City}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA: update crea o actualiza las tablas según las entidades.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
